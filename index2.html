<style>
:root{
  /* Layout: a typeset CV page, 960px wide. Section titles sit in a 200px left column, content on the right; one column on phones. */
  --bg:#FFFFFF;
  --text:#17191C;
  --muted:#5C6470;
  --rule:#E3E6EA;
  --accent:#1D5FB4;
  --tint:#F4F6F8;
  --glow-a:rgba(29,95,180,.15);
  --glow-b:rgba(14,150,128,.11);
  --serif:"IBM Plex Serif","IBM Plex Sans Hebrew",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans","IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --label:200px;
  --sub:150px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141618; --text:#E7E9EC; --muted:#A0A7B1; --rule:#2B2F34; --accent:#86B4F0; --tint:#1C1F23;
    --glow-a:rgba(134,180,240,.16); --glow-b:rgba(60,200,165,.10);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141618; --text:#E7E9EC; --muted:#A0A7B1; --rule:#2B2F34; --accent:#86B4F0; --tint:#1C1F23;
  --glow-a:rgba(134,180,240,.16); --glow-b:rgba(60,200,165,.10);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:1rem;line-height:1.6;font-variant-numeric:tabular-nums}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.ltr{direction:ltr;unicode-bidi:isolate}
[dir="rtl"] .ltr{text-align:right}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.glow{position:absolute;left:0;top:0;border-radius:50%;will-change:transform}
.glow.a{width:860px;height:860px;margin:-430px 0 0 -430px;background:radial-gradient(closest-side,var(--glow-a),transparent)}
.glow.b{width:1100px;height:1100px;margin:-550px 0 0 -550px;background:radial-gradient(closest-side,var(--glow-b),transparent)}
.page{position:relative;z-index:1;max-width:960px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
section[id]{scroll-margin-top:16px}

.skip{position:absolute;inset-inline-start:16px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:10;background:var(--bg);padding:6px 10px}
.skip:not(:focus){width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Top line */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;padding-block:20px;border-bottom:1px solid var(--rule)}
.nav{display:flex;flex-wrap:wrap;gap:4px 20px}
.nav a{color:var(--muted);text-decoration:none;font-size:.9375rem}
.nav a:hover{color:var(--text)}
.langs{display:flex;gap:2px}
.langs button{font:500 .8125rem/1 var(--sans);letter-spacing:.04em;color:var(--muted);background:none;border:0;padding:6px 7px;cursor:pointer;border-radius:3px}
.langs button:hover{color:var(--text)}
.langs button[aria-pressed="true"]{color:var(--text);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.tools{display:flex;align-items:center;gap:10px}
.theme-btn{display:grid;place-items:center;width:32px;height:30px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}
.theme-btn:hover{color:var(--text);border-color:var(--muted)}
.theme-btn svg{width:16px;height:16px}

/* Intro */
.intro{display:grid;grid-template-columns:var(--label) minmax(0,1fr);gap:24px 40px;padding-block:48px 52px}
.photo{width:160px;aspect-ratio:3 / 4;max-width:100%;object-fit:cover;border-radius:6px;background:var(--tint)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.25rem,5vw,3.25rem);line-height:1.08;letter-spacing:-.01em;margin:0}
.role{margin:10px 0 0;font-size:1.125rem;font-weight:500}
.role span{color:var(--muted);font-weight:400}
.intro-text{display:grid;gap:14px;margin-top:24px;font-size:1.0625rem;line-height:1.65;max-width:62ch}
.intro-text p{margin:0}
.quick{display:flex;flex-wrap:wrap;gap:6px 22px;margin:22px 0 0;padding:0;list-style:none;font-size:.9375rem}

/* Sections */
.sec{display:grid;grid-template-columns:var(--label) minmax(0,1fr);gap:16px 40px;padding-block:44px;border-top:1px solid var(--rule)}
h2{font-family:var(--serif);font-weight:600;font-size:1.375rem;line-height:1.25;margin:0;text-wrap:balance}
html[lang="he"] h2,html[lang="he"] h1.post-title{font-family:var(--sans)}
.body{min-width:0}
.rows{display:grid;gap:14px;margin:0}
.row{display:grid;grid-template-columns:var(--sub) minmax(0,1fr);gap:4px 24px}
.row dt,.row .k{color:var(--muted)}
.row dd{margin:0}

/* Projects */
.works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.work{margin:0;display:grid;gap:12px;align-content:start}
.work img{display:block;width:100%;height:auto;aspect-ratio:16 / 9;object-fit:cover;object-position:top;border:1px solid var(--rule);border-radius:6px;background:var(--tint)}
.work .tree{margin:0;aspect-ratio:16 / 9;display:flex;align-items:center;padding:16px 22px;border:1px solid var(--rule);border-radius:6px;background:var(--tint);font:400 .875rem/1.7 ui-monospace,"Cascadia Mono",Consolas,monospace;white-space:pre;overflow:auto;text-align:left}
.work figcaption{display:grid;gap:4px}
.work .name{font-weight:600}
.work .what{color:var(--muted);font-size:.875rem}
[dir="rtl"] .work .what{text-align:right}
.group-title{margin:0 0 14px;font-size:1rem;font-weight:600}
#works > * + .group-title{margin-top:40px}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 20px}
.thumb{margin:0;display:grid;gap:8px;align-content:start}
.thumb img{display:block;width:100%;height:auto;aspect-ratio:16 / 9;object-fit:cover;object-position:top;border:1px solid var(--rule);border-radius:5px;background:var(--tint)}
.thumb figcaption{display:grid;gap:2px}
.thumb .name{font-weight:600;font-size:.9375rem}
.thumb p{margin:0;font-size:.875rem;color:var(--muted)}
.work p{margin:2px 0 0;font-size:.9375rem}
.also{margin-top:30px;display:grid;gap:12px;max-width:68ch}
.also p{margin:0}
.sites{display:inline}

/* Experience */
.job{display:grid;grid-template-columns:var(--sub) minmax(0,1fr);gap:4px 24px;padding-bottom:28px}
.job + .job{padding-top:28px;border-top:1px solid var(--rule)}
.job:last-child{padding-bottom:0}
.when{color:var(--muted);font-size:.9375rem}
.when .dur{display:block;font-size:.8125rem}
.job h3{margin:0;font-size:1.0625rem;font-weight:600;line-height:1.4}
.org{margin:2px 0 0;color:var(--muted)}
.job ul{margin:10px 0 0;padding-inline-start:1.15em;display:grid;gap:4px;max-width:66ch}

/* Inspiration */
.prose-sm{display:grid;gap:14px;max-width:64ch}
.prose-sm p{margin:0}

/* Blog list */
.posts{list-style:none;margin:0;padding:0;display:grid;gap:22px}
.post{display:grid;grid-template-columns:var(--sub) minmax(0,1fr);gap:4px 24px}
.post time{color:var(--muted);font-size:.9375rem}
.post a{font-weight:600;font-size:1.0625rem}
.post p{margin:4px 0 0;color:var(--muted);max-width:64ch}

/* Contacts */
.contacts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.contacts li{display:grid;grid-template-columns:var(--sub) minmax(0,1fr) auto;gap:4px 24px;align-items:baseline}
.contacts .k{color:var(--muted)}
.contacts .v{overflow-wrap:anywhere}
.copy{font:500 .8125rem/1 var(--sans);color:var(--muted);background:none;border:1px solid var(--rule);border-radius:4px;padding:5px 8px;cursor:pointer}
.copy:hover{color:var(--text);border-color:var(--muted)}

/* Post reader */
.reader{padding-block:36px 64px;max-width:680px}
.back{text-decoration:none;font-size:.9375rem}
h1.post-title{font-size:clamp(1.75rem,4vw,2.25rem);line-height:1.2;margin:20px 0 10px}
.meta{color:var(--muted);font-size:.9375rem;padding-bottom:20px;border-bottom:1px solid var(--rule)}
.prose{font-size:1.0625rem;line-height:1.72;max-width:64ch}
.prose p{margin:1em 0}
.prose ul{padding-inline-start:1.2em}
.prose code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.88em;background:var(--tint);padding:.1em .3em;border-radius:3px;direction:ltr;unicode-bidi:isolate}
.more{margin-top:44px;padding-top:24px;border-top:1px solid var(--rule)}
.more h2{font-size:1.125rem;margin-bottom:16px}

footer{border-top:1px solid var(--rule);padding-block:24px 36px;color:var(--muted);font-size:.875rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}

@media (max-width:760px){
  .intro,.sec{grid-template-columns:minmax(0,1fr)}
  .intro{padding-block:32px 40px}
  .photo{width:112px}
  .sec{padding-block:36px}
  .works{grid-template-columns:minmax(0,1fr)}
  .thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:420px){.thumbs{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){
  .row,.job,.post{grid-template-columns:minmax(0,1fr)}
  .contacts li{grid-template-columns:minmax(0,1fr) auto}
  .contacts .k{grid-column:1 / -1}
}
</style>

/* ===================== Логика страницы ===================== */
const LANGS = ["ru", "uk", "en", "he"];
const LANG_LABEL = { ru: "RU", uk: "UA", en: "EN", he: "HE" };
const LANG_NAME = { ru: "Русский", uk: "Українська", en: "English", he: "עברית" };
const LOCALE = { ru: "ru-RU", uk: "uk-UA", en: "en-GB", he: "he-IL" };
const RTL = { he: true };

let lang = "en";
let currentPost = null;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const L = v => (v && typeof v === "object" && !Array.isArray(v)) ? (v[lang] != null ? v[lang] : (v.en || "")) : (v == null ? "" : v);
const t = k => (I18N[lang] && I18N[lang][k] != null) ? I18N[lang][k] : (I18N.en[k] != null ? I18N.en[k] : k);
const link = (url, label, cls) => `<a${cls ? ` class="${cls}"` : ""} href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`;
const linkify = s => esc(s).replace(/\[\[(\w+)\|([^\]]+)\]\]/g, (m, key, label) => LINKS[key] ? link(LINKS[key], label) : label);
const pretty = url => url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");

function fmtDate(iso, long) {
  const [y, m, d] = iso.split("-").map(Number);
  const opts = long ? { day: "numeric", month: "long", year: "numeric" } : { day: "numeric", month: "short", year: "numeric" };
  return new Intl.DateTimeFormat(LOCALE[lang], opts).format(new Date(y, m - 1, d));
}
function period(from, to) {
  if (!from.includes("-")) return { span: to && to !== from ? `${from} — ${to}` : from, dur: "" };
  const [fy, fm] = from.split("-").map(Number);
  const now = new Date();
  const [ty, tm] = to ? to.split("-").map(Number) : [now.getFullYear(), now.getMonth() + 1];
  const total = (ty * 12 + tm) - (fy * 12 + fm) + 1;
  const unit = (n, u) => new Intl.NumberFormat(LOCALE[lang], { style: "unit", unit: u, unitDisplay: "long" }).format(n);
  const yrs = Math.floor(total / 12), mos = total % 12;
  const p2 = n => String(n).padStart(2, "0");
  return {
    span: `${p2(fm)}.${fy} — ${to ? `${p2(tm)}.${ty}` : t("now")}`,
    dur: [yrs ? unit(yrs, "year") : "", mos ? unit(mos, "month") : ""].filter(Boolean).join(" ")
  };
}
const readTime = body => `${Math.max(1, Math.round(body.split(/\s+/).length / 180))} ${t("min")}`;
const sortedPosts = () => POSTS.slice().sort((a, b) => b.date.localeCompare(a.date));

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const out = [];
  let para = [], list = null;
  const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<ul>${list.map(li => `<li>${inline(li)}</li>`).join("")}</ul>`); list = null; } };
  for (const raw of src.split("\n")) {
    const line = raw.trim();
    if (!line) { flushPara(); flushList(); continue; }
    if (line.startsWith("## ")) { flushPara(); flushList(); out.push(`<h2>${inline(line.slice(3))}</h2>`); continue; }
    if (line.startsWith("- ")) { flushPara(); (list = list || []).push(line.slice(2)); continue; }
    flushList();
    para.push(line);
  }
  flushPara(); flushList();
  return out.join("");
}
function excerpt(body) {
  const first = body.split(/\n\s*\n/).map(b => b.trim()).find(b => b && !b.startsWith("##") && !b.startsWith("- ")) || "";
  const plain = first.replace(/\s+/g, " ").replace(/[`*]/g, "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
  if (plain.length <= 160) return plain;
  return plain.slice(0, plain.lastIndexOf(" ", 158)).replace(/[,.:;]$/, "") + "…";
}
const postItem = p => `<li class="post"><time datetime="${p.date}">${fmtDate(p.date)}</time><div>` +
  `<a href="#post-${p.slug}" data-slug="${p.slug}">${esc(L(p.title))}</a><p>${esc(excerpt(L(p.body)))}</p></div></li>`;

/* --- Отрисовка --- */
function renderIntro() {
  $("#name").textContent = PROFILE.name;
  $("#roleLine").textContent = PROFILE.roleLine;
  $("#loc").textContent = t("loc");
  const photo = $("#photo");
  photo.alt = PROFILE.name;
  photo.hidden = !PROFILE.photo;
  if (PROFILE.photo) photo.src = PROFILE.photo;
  const q = [];
  if (CONTACTS.email) q.push(`<li class="ltr">${link("mailto:" + CONTACTS.email, CONTACTS.email).replace(' target="_blank" rel="noopener"', "")}</li>`);
  if (CONTACTS.telegram) q.push(`<li class="ltr">${link("https://t.me/" + CONTACTS.telegram.replace(/^@/, ""), "Telegram @" + CONTACTS.telegram.replace(/^@/, ""))}</li>`);
  if (CONTACTS.phone) q.push(`<li class="ltr">${esc(CONTACTS.phone)}</li>`);
  if (CONTACTS.github) q.push(`<li class="ltr">${link(CONTACTS.github, "GitHub")}</li>`);
  if (CONTACTS.youtube) q.push(`<li class="ltr">${link(CONTACTS.youtube, "YouTube")}</li>`);
  $("#quick").innerHTML = q.join("");
  $("#footName").innerHTML = `© 2026 <span class="ltr">${esc(PROFILE.name)}</span>`;
}

function renderProjects() {
  const card = w => `<figure class="work">
      ${w.img ? `<a href="${esc(w.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img src="${esc(w.img)}" width="1200" height="675" loading="lazy" alt="${esc(t("shot_alt").replace("{d}", w.title))}"></a>`
        : `<pre class="tree" dir="ltr">${esc(w.tree.join("\n"))}</pre>`}
      <figcaption>${w.url ? link(w.url, w.title, "name ltr") : `<span class="name ltr">${esc(w.title)}</span>`}<span class="what" dir="auto">${esc(L(w.what))}</span><p>${esc(L(w.d))}</p></figcaption>
    </figure>`;
  const thumb = s => `<figure class="thumb">
      <a href="${esc(s.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img src="${esc(s.img)}" width="800" height="450" loading="lazy" alt="${esc(t("shot_alt").replace("{d}", s.host))}"></a>
      <figcaption>${link(s.url, s.host, "name ltr")}<p>${esc(L(s.d))}</p></figcaption>
    </figure>`;
  $("#works").innerHTML = [["client", "grp_client"], ["pet", "grp_pet"]].map(([g, k]) => {
    const list = WORKS.filter(w => w.group === g);
    return list.length ? `<h3 class="group-title">${esc(t(k))}</h3><div class="works">${list.map(card).join("")}</div>` : "";
  }).join("") +
    (MORE_SITES.length ? `<h3 class="group-title">${esc(t("grp_more"))}</h3><div class="thumbs">${MORE_SITES.map(thumb).join("")}</div>` : "");
  $("#also").innerHTML =
    `<p>${esc(t("mia_line"))}</p>` +
    (CONTACTS.youtube ? `<p>${linkify(t("yt_line"))}</p>` : "") +
    `<p>${link(ALSO.um.url, "Ultimate Member", "ltr")} — ${esc(L(ALSO.um.d))}</p>` +
    `<p>${esc(t("earlier"))} <span class="sites">${ALSO.sites.map(s => link("https://" + s, s, "ltr")).join(", ")}</span></p>` +
    `<p>${esc(t("total_line"))}</p>`;
}

function renderExperience() {
  $("#jobs").innerHTML = EXPERIENCE.map(j => {
    const p = period(j.from, j.to);
    const pts = (j.points && (j.points[lang] || j.points.en)) || [];
    return `<div class="job">
      <div class="when"><span class="ltr">${esc(p.span)}</span><span class="dur">${esc(p.dur)}</span></div>
      <div><h3 class="ltr">${esc(j.role)}</h3><p class="org"><span class="ltr">${esc(L(j.company))}</span> · ${esc(L(j.place))}</p>` +
      (pts.length ? `<ul>${pts.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "") + `</div></div>`;
  }).join("");
}

function renderSkills() {
  const rows = SKILLS.map(s => [t(s.k), `<span class="ltr">${esc(s.items)}</span>`]);
  rows.push([t("langs_label"), esc(t("langs_text"))]);
  rows.push([t("edu_label"), esc(t("edu_text"))]);
  $("#skillRows").innerHTML = rows.map(([k, v]) => `<div class="row"><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join("");
}

function renderPosts() {
  $("#posts").innerHTML = sortedPosts().map(postItem).join("");
}

function renderContacts() {
  const row = (k, v, copy) => `<li><span class="k">${esc(k)}</span><span class="v">${v}</span>` +
    (copy ? `<button type="button" class="copy" data-copy="${esc(copy)}">${esc(t("copy"))}</button>` : "<span></span>") + `</li>`;
  const rows = [];
  if (CONTACTS.email) rows.push(row("Email", `<span class="ltr">${esc(CONTACTS.email)}</span>`, CONTACTS.email));
  if (CONTACTS.telegram) {
    const h = CONTACTS.telegram.replace(/^@/, "");
    rows.push(row("Telegram", link("https://t.me/" + h, "@" + h, "ltr"), "@" + h));
  }
  if (CONTACTS.phone) rows.push(row(t("c_phone"), `<span class="ltr">${esc(CONTACTS.phone)}</span>`, CONTACTS.phone));
  if (CONTACTS.youtube) rows.push(row("YouTube", link(CONTACTS.youtube, pretty(CONTACTS.youtube), "ltr")));
  if (CONTACTS.github) rows.push(row("GitHub", link(CONTACTS.github, pretty(CONTACTS.github), "ltr")));
  if (CONTACTS.linkedin) rows.push(row("LinkedIn", link(CONTACTS.linkedin, pretty(CONTACTS.linkedin), "ltr")));
  if (CONTACTS.dou) rows.push(row("DOU", link(CONTACTS.dou, pretty(CONTACTS.dou), "ltr")));
  if (CONTACTS.workua) rows.push(row("Work.ua", link(CONTACTS.workua, pretty(CONTACTS.workua), "ltr")));
  $("#contacts").innerHTML = rows.join("");
}

function renderReader() {
  const p = POSTS.find(x => x.slug === currentPost);
  if (!p) return;
  const others = sortedPosts().filter(x => x !== p);
  $("#reader").innerHTML =
    `<a class="back" href="#blog">${RTL[lang] ? "→" : "←"} ${esc(t("back"))}</a>
     <h1 class="post-title" id="readerTitle" tabindex="-1">${esc(L(p.title))}</h1>
     <p class="meta"><time datetime="${p.date}">${fmtDate(p.date, true)}</time> · ${esc(readTime(L(p.body)))}</p>
     <div class="prose">${md(L(p.body))}</div>` +
    (others.length ? `<div class="more"><h2>${esc(t("more"))}</h2><ul class="posts">${others.map(postItem).join("")}</ul></div>` : "");
}

function copyText(btn) {
  const value = btn.dataset.copy;
  const done = () => { btn.textContent = t("copied"); setTimeout(() => { btn.textContent = t("copy"); }, 1600); };
  const selectFallback = () => {
    const el = btn.parentElement.querySelector(".v");
    if (!el) return;
    const r = document.createRange(); r.selectNodeContents(el);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  };
  try { navigator.clipboard.writeText(value).then(done, selectFallback); } catch (e) { selectFallback(); }
}

/* --- Тема: светлая / тёмная. По умолчанию — как в системе посетителя, выбор запоминается --- */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const darkMq = window.matchMedia("(prefers-color-scheme: dark)");
const isDark = () => {
  const a = document.documentElement.getAttribute("data-theme");
  return a ? a === "dark" : darkMq.matches;
};
function renderThemeBtn() {
  const b = $("#themeBtn");
  if (!b) return;
  const dark = isDark();
  b.innerHTML = dark ? SUN : MOON;
  b.setAttribute("aria-label", t(dark ? "to_light" : "to_dark"));
  b.title = t(dark ? "to_light" : "to_dark");
}
function toggleTheme() {
  const next = isDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("cv-theme", next); } catch (e) {}
  renderThemeBtn();
}
try {
  const saved = localStorage.getItem("cv-theme");
  if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
} catch (e) {}
if (darkMq.addEventListener) darkMq.addEventListener("change", renderThemeBtn);

/* --- Язык --- */
function renderLangs() {
  const box = $("#langs");
  box.setAttribute("aria-label", t("lang_label"));
  box.innerHTML = LANGS.map(l => `<button type="button" data-lang="${l}" lang="${l}" title="${LANG_NAME[l]}" aria-pressed="${l === lang}">${LANG_LABEL[l]}</button>`).join("");
}
function setLang(l, save) {
  lang = LANGS.includes(l) ? l : "en";
  document.documentElement.lang = lang;
  document.documentElement.dir = RTL[lang] ? "rtl" : "ltr";
  if (save) { try { localStorage.setItem("cv-lang", lang); } catch (e) {} }
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = linkify(t(el.dataset.i18nHtml)); });
  $("#nav").setAttribute("aria-label", t("projects_title") + " · " + t("contact_title"));
  document.title = `${PROFILE.name} · ${t("doc_role")}`;
  renderLangs(); renderThemeBtn(); renderIntro(); renderProjects(); renderExperience(); renderSkills(); renderPosts(); renderContacts();
  if (currentPost) renderReader();
}
function initialLang() {
  const fromHash = location.hash.slice(1);
  if (LANGS.includes(fromHash)) return fromHash;
  try { const s = localStorage.getItem("cv-lang"); if (LANGS.includes(s)) return s; } catch (e) {}
  const prefs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""]);
  for (const p of prefs) {
    const c = String(p).slice(0, 2).toLowerCase();
    if (c === "ua") return "uk";
    if (c === "iw") return "he";
    if (LANGS.includes(c)) return c;
  }
  return "en";
}

/* --- Маршруты: #ru / #uk / #en / #he — язык, #post-<slug> — запись блога, остальное — разделы --- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (LANGS.includes(h)) { if (h !== lang) setLang(h, false); return; }
  const p = h.startsWith("post-") ? POSTS.find(x => x.slug === h.slice(5)) : null;
  if (p) {
    currentPost = p.slug;
    renderReader();
    $("#home").hidden = true;
    $("#reader").hidden = false;
    window.scrollTo(0, 0);
    const title = $("#readerTitle");
    if (title) title.focus({ preventScroll: true });
    return;
  }
  if (currentPost) {
    currentPost = null;
    $("#reader").hidden = true;
    $("#home").hidden = false;
    const target = h && document.getElementById(h);
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }
}
function go(hash) {
  if (location.hash !== "#" + hash) {
    try { history.pushState(null, "", "#" + hash); } catch (e) { location.hash = hash; }
  }
  route();
}

document.addEventListener("click", e => {
  if (e.target.closest("#themeBtn")) { toggleTheme(); return; }
  const langBtn = e.target.closest("[data-lang]");
  if (langBtn) { setLang(langBtn.dataset.lang, true); return; }
  const post = e.target.closest("[data-slug]");
  if (post) { e.preventDefault(); go("post-" + post.dataset.slug); return; }
  const copy = e.target.closest("[data-copy]");
  if (copy) { copyText(copy); }
});
window.addEventListener("hashchange", route);
window.addEventListener("popstate", route);

setLang(initialLang(), false);
route();

/* --- Фон: мягкое свечение, которое плавно идёт за курсором --- */
(function glowField() {
  const a = document.querySelector(".glow.a"), b = document.querySelector(".glow.b");
  if (!a || !b) return;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  const pos = { ax: 0, ay: 0, bx: 0, by: 0 };
  let target = null, lastMove = 0;

  const place = () => {
    a.style.transform = `translate3d(${pos.ax}px,${pos.ay}px,0)`;
    b.style.transform = `translate3d(${pos.bx}px,${pos.by}px,0)`;
  };
  // Without a cursor (phones, or an idle mouse) the glow drifts slowly on its own.
  const drift = t => ({
    x: innerWidth * (0.5 + 0.32 * Math.sin(t / 9000)),
    y: innerHeight * (0.42 + 0.26 * Math.cos(t / 11000))
  });
  function frame(t) {
    const idle = !target || t - lastMove > 4000;
    const goal = idle ? drift(t) : target;
    const k = idle ? 0.02 : 0.09;
    pos.ax += (goal.x - pos.ax) * k;
    pos.ay += (goal.y - pos.ay) * k;
    // The second glow trails behind, a little off to the side.
    const bx = goal.x - 180 + 120 * Math.sin(t / 5000), by = goal.y + 140 + 90 * Math.cos(t / 6000);
    pos.bx += (bx - pos.bx) * 0.025;
    pos.by += (by - pos.by) * 0.025;
    place();
    requestAnimationFrame(frame);
  }

  const start = drift(performance.now());
  pos.ax = start.x; pos.ay = start.y; pos.bx = start.x - 180; pos.by = start.y + 140;
  place();
  if (reduce.matches) return;
  window.addEventListener("pointermove", e => {
    target = { x: e.clientX, y: e.clientY };
    lastMove = performance.now();
  }, { passive: true });
  requestAnimationFrame(frame);
})();
})();
</script>
