<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gori4ka · Igor Mavl</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Igor Mavl — Full Stack Developer (PHP / JavaScript) из Киева. Сайты и веб-приложения, REST API, React, Laravel, WordPress, AI-поиск, сайты на иврите. Пет-проекты: TrackDesk, DevBox и игра на Godot.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600;700&family=Rubik:wght@400;500;700;800&display=swap">
<style>
:root{
  /* Layout: a portfolio site in full-width bands. White hero, plum stats strip, white work grid,
     plum list of sites with cursor previews, orange YouTube band, white experience, plum contact. 1200px column. */
  --paper:#FFFFFF;
  --soft:#F7F2F8;
  --ink:#24152B;
  --ink-2:#5F5167;
  --line:#E6DEE9;
  --orange:#F2681D;
  --sun:#FFB23F;
  --plum:#2A1733;
  --on-plum:#F7F0F8;
  --on-plum-2:#BFAFC7;
  --on-orange:#1B0F21;
  --edge:#24152B;
  --drop:#24152B;
  --glow:rgba(242,104,29,.16);
  --font:"Rubik","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --pixel:"Pixelify Sans","Rubik",ui-monospace,monospace;
  --col:1200px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#150C1A; --soft:#1F1426; --ink:#F4ECF6; --ink-2:#BCAEC4; --line:#34253C;
    --orange:#FF7A2F; --sun:#FFC15C; --plum:#0E0712; --on-plum:#F4ECF6; --on-plum-2:#A998B1;
    --edge:#4E3A59; --drop:#FF7A2F; --glow:rgba(255,122,47,.13);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#150C1A; --soft:#1F1426; --ink:#F4ECF6; --ink-2:#BCAEC4; --line:#34253C;
  --orange:#FF7A2F; --sun:#FFC15C; --plum:#0E0712; --on-plum:#F4ECF6; --on-plum-2:#A998B1;
  --edge:#4E3A59; --drop:#FF7A2F; --glow:rgba(255,122,47,.13);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:1.0625rem;line-height:1.6}
img{max-width:100%}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--col);margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
section[id]{scroll-margin-top:84px}
.ltr{direction:ltr;unicode-bidi:isolate}
h1,h2,h3{text-wrap:balance}

.skip{position:absolute;inset-inline-start:16px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:60;background:var(--paper);padding:8px 12px;border:2px solid var(--edge);border-radius:8px}
.skip:not(:focus){width:1px;height:1px;padding:0;border:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Chunky buttons, like the ones in the Gori4ka game */
.btn{display:inline-flex;align-items:center;gap:10px;font:700 1rem/1 var(--font);text-decoration:none;color:var(--ink);background:var(--paper);border:2px solid var(--edge);border-radius:12px;padding:14px 20px;box-shadow:4px 4px 0 var(--drop);cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--drop)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--drop)}
.btn.primary{background:var(--orange);color:var(--on-orange);border-color:var(--on-orange);box-shadow:4px 4px 0 var(--on-orange)}
.btn.primary:hover{box-shadow:6px 6px 0 var(--on-orange)}
.btn.small{padding:10px 14px;font-size:.9375rem}

/* Nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--paper);border-bottom:2px solid var(--edge)}
.nav .wrap{display:flex;align-items:center;gap:12px 24px;min-height:70px;flex-wrap:wrap}
.mark{font:700 1.5rem/1 var(--pixel);letter-spacing:.04em;color:var(--orange);text-decoration:none;text-shadow:2px 2px 0 var(--on-orange)}
.links{display:flex;gap:4px 22px;margin-inline-start:auto}
.links a{text-decoration:none;font-weight:500;color:var(--ink-2);white-space:nowrap}
.links a:hover{color:var(--ink)}
.langs{display:flex;border:2px solid var(--edge);border-radius:10px;overflow:hidden}
.langs button{font:700 .75rem/1 var(--font);letter-spacing:.05em;border:0;background:transparent;color:var(--ink-2);padding:9px 10px;cursor:pointer}
.langs button + button{border-inline-start:2px solid var(--edge)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.theme-btn{display:grid;place-items:center;width:40px;height:36px;border:2px solid var(--edge);border-radius:10px;background:var(--paper);color:var(--ink);cursor:pointer}
.theme-btn:hover{background:var(--soft)}
.theme-btn svg{width:18px;height:18px}
@media (max-width:900px){
  .nav .wrap{min-height:60px}
  .links{order:3;width:100%;margin-inline-start:0;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;margin-top:-4px}
  .links::-webkit-scrollbar{display:none}
  .langs{margin-inline-start:auto}
  .theme-btn{order:2}
  .nav .btn{display:none}
  section[id]{scroll-margin-top:110px}
}

/* Hero */
.hero{position:relative;overflow:hidden;isolation:isolate;padding-block:72px 96px}
.hero-glow{position:absolute;left:0;top:0;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent);z-index:-2;pointer-events:none;opacity:0;transition:opacity .6s}
.hero.live .hero-glow{opacity:1}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:48px;align-items:center}
.hello{font-weight:500;color:var(--ink-2);margin:0 0 18px}
.hero h1{font-weight:800;font-size:clamp(2.6rem,6.4vw,5.4rem);line-height:1;letter-spacing:-.025em;margin:0}
.hero h1 span{display:block}
.hero h1 .l2{color:var(--orange)}
.hero-sub{max-width:36em;font-size:clamp(1.0625rem,1.6vw,1.25rem);color:var(--ink-2);margin:26px 0 0}
.hero-cta{display:flex;flex-wrap:wrap;gap:16px;margin-top:34px}
.photo-wrap{position:relative;justify-self:center;width:min(100%,340px)}
.photo-card{border:3px solid var(--edge);border-radius:22px;overflow:hidden;box-shadow:12px 12px 0 var(--drop);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) rotate(-2.5deg);transition:box-shadow .2s;background:var(--soft)}
.photo-card img{display:block;width:100%;aspect-ratio:3 / 4;object-fit:cover;object-position:50% 30%}
.sticker{position:absolute;bottom:-22px;inset-inline-start:-26px;background:var(--sun);color:var(--on-orange);border:2px solid var(--on-orange);border-radius:14px;padding:10px 16px;box-shadow:4px 4px 0 var(--on-orange);transform:rotate(-6deg);line-height:1.2}
.sticker b{display:block;font-size:1.0625rem}
.sticker span{font-size:.875rem;font-weight:500}
.px{position:absolute;z-index:-1;width:var(--s);height:var(--s);border:2px solid var(--edge);pointer-events:none;will-change:transform}
.px.o{background:var(--orange)}
.px.s{background:var(--sun)}
.px.k{background:var(--plum)}
.px.w{background:var(--paper)}
@media (max-width:860px){
  .hero{padding-block:44px 72px}
  .hero-grid{grid-template-columns:minmax(0,1fr)}
  .photo-wrap{width:min(78%,300px);margin-top:12px}
  .px.hide-sm{display:none}
}

/* Stats */
.stats{background:var(--plum);color:var(--on-plum)}
.stats .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding-block:34px}
.stat b{display:block;font-weight:800;font-size:clamp(2.4rem,5vw,3.6rem);line-height:1;color:var(--sun)}
.stat span{display:block;margin-top:8px;color:var(--on-plum-2);font-size:.9375rem;line-height:1.35}
@media (max-width:700px){.stats .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Section heads */
.band{padding-block:96px}
.head{display:grid;gap:12px;max-width:760px;margin-bottom:44px}
.head h2{font-weight:800;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.02;letter-spacing:-.02em;margin:0}
.head p{margin:0;color:var(--ink-2);font-size:1.125rem}
@media (max-width:700px){.band{padding-block:64px}}

/* Featured work */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px}
.card{display:flex;flex-direction:column;background:var(--paper);border:2px solid var(--edge);border-radius:18px;overflow:hidden;box-shadow:6px 6px 0 var(--drop);text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--drop)}
.chrome{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:2px solid var(--edge);background:var(--soft);direction:ltr}
.chrome i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--edge)}
.chrome i:nth-child(1){background:#FF5F57}
.chrome i:nth-child(2){background:#FEBC2E}
.chrome i:nth-child(3){background:#28C840}
.chrome span{margin-inline-start:10px;font-size:.8125rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card img{display:block;width:100%;height:auto;aspect-ratio:16 / 9;object-fit:cover;object-position:top}
.card-body{display:grid;gap:8px;padding:20px 22px 24px;border-top:2px solid var(--edge)}
.tag{justify-self:start;font-size:.8125rem;font-weight:700;padding:5px 10px;border:2px solid var(--edge);border-radius:8px;background:var(--sun);color:var(--on-orange)}
.tag.own{background:var(--paper);color:var(--ink)}
.card h3{margin:0;font-size:1.5rem;line-height:1.2;font-weight:700}
.card .what{color:var(--ink-2);font-size:.9375rem}
.card p{margin:0;color:var(--ink-2)}
.card.wide{grid-column:1 / -1}
.card.wide:hover{transform:none;box-shadow:6px 6px 0 var(--drop)}
.wide-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.wide-grid .card-body{border-top:0;border-inline-start:2px solid var(--edge);align-content:center;padding:28px 30px}
.ftree{margin:0;padding:24px 28px;background:var(--plum);color:var(--on-plum);font:500 .9375rem/1.55 ui-monospace,"Cascadia Mono",Consolas,monospace;overflow-x:auto;text-align:left}
@media (max-width:760px){
  .cards{grid-template-columns:minmax(0,1fr)}
  .wide-grid{grid-template-columns:minmax(0,1fr)}
  .wide-grid .card-body{border-inline-start:0;border-top:2px solid var(--edge)}
}

/* Index of sites with cursor preview */
.index{background:var(--plum);color:var(--on-plum)}
.index .head p{color:var(--on-plum-2)}
.rows{list-style:none;margin:0;padding:0;border-bottom:1px solid color-mix(in srgb,var(--on-plum) 18%,transparent)}
.site-row a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:center;padding:22px 0;border-top:1px solid color-mix(in srgb,var(--on-plum) 18%,transparent);text-decoration:none;color:inherit;transition:padding .2s}
.site-row .dom{font-weight:700;font-size:clamp(1.5rem,3.6vw,2.6rem);line-height:1.1;letter-spacing:-.01em;transition:color .15s}
.site-row .desc{grid-column:1;color:var(--on-plum-2);font-size:.9375rem}
.site-row .arr{grid-column:2;grid-row:1 / span 2;font-size:1.6rem;color:var(--sun);transition:transform .2s}
.site-row a:hover{padding-inline-start:14px}
.site-row a:hover .dom{color:var(--sun)}
.site-row a:hover .arr{transform:translate(4px,-4px)}
.site-row .thumb{display:none}
.hint{margin:18px 0 0;color:var(--on-plum-2);font-size:.875rem}
#peek{position:fixed;left:0;top:0;z-index:50;width:360px;aspect-ratio:16 / 9;object-fit:cover;object-position:top;border:3px solid #0E0712;border-radius:14px;box-shadow:8px 8px 0 var(--orange);pointer-events:none;opacity:0;transition:opacity .18s;will-change:transform}
#peek.on{opacity:1}
@media (hover:none),(pointer:coarse){
  .hint{display:none}
  .site-row a{grid-template-columns:96px minmax(0,1fr)}
  .site-row .thumb{display:block;grid-row:1 / span 2;width:96px;aspect-ratio:16 / 9;object-fit:cover;object-position:top;border:2px solid #0E0712;border-radius:8px}
  .site-row .dom,.site-row .desc{grid-column:2}
  .site-row .arr{display:none}
}

/* About + inspiration */
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start}
.big{font-weight:800;font-size:clamp(2rem,4.4vw,3.5rem);line-height:1.05;letter-spacing:-.02em;margin:0}
.big span{color:var(--orange)}
.about-text{display:grid;gap:16px;font-size:1.125rem}
.about-text p{margin:0}
.inspo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:64px}
.ins{background:var(--soft);border:2px solid var(--edge);border-radius:18px;padding:24px;box-shadow:5px 5px 0 var(--drop)}
.ins h3{margin:0 0 10px;font-size:1.25rem;font-weight:700;line-height:1.25}
.ins p{margin:0;color:var(--ink-2);font-size:1rem}
.ins a{color:var(--orange);font-weight:500}
@media (max-width:900px){.about-grid,.inspo{grid-template-columns:minmax(0,1fr)}.about-grid{gap:28px}}

/* YouTube band */
.yt{background:var(--orange);color:var(--on-orange)}
.yt-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:56px;align-items:start}
.yt h2{font-weight:800;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.02;letter-spacing:-.02em;margin:0}
.yt p{margin:16px 0 28px;font-size:1.125rem;max-width:30em}
.btn.dark{background:var(--on-orange);color:#FFF6EC;border-color:var(--on-orange);box-shadow:4px 4px 0 #FFF6EC}
.btn.dark:hover{box-shadow:6px 6px 0 #FFF6EC}
.eps{list-style:none;margin:0;padding:0;border-top:2px solid var(--on-orange)}
.eps li{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:14px 0;border-bottom:2px solid color-mix(in srgb,var(--on-orange) 25%,transparent)}
.eps .day{font-weight:800;font-size:1.0625rem}
.eps .t{font-weight:500}
.eps .len{font-size:.875rem;opacity:.75;font-variant-numeric:tabular-nums}
@media (max-width:900px){.yt-grid{grid-template-columns:minmax(0,1fr);gap:32px}}
@media (max-width:480px){.eps li{grid-template-columns:64px minmax(0,1fr)}.eps .len{display:none}}

/* Experience */
.jobs{border-top:2px solid var(--edge)}
.job{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px 40px;padding-block:32px;border-bottom:2px solid var(--edge)}
.years{font-weight:800;font-size:1.75rem;line-height:1.1;font-variant-numeric:tabular-nums}
.years-dur{display:block;font-weight:500;font-size:.875rem;color:var(--ink-2);margin-top:6px}
.company{margin-top:10px;font-weight:700;color:var(--orange)}
.job h3{margin:0 0 10px;font-size:1.25rem;font-weight:700}
.job ul{margin:0;padding-inline-start:1.15em;display:grid;gap:6px;color:var(--ink-2)}
.job li::marker{color:var(--orange)}
@media (max-width:760px){.job{grid-template-columns:minmax(0,1fr)}}

/* Skills */
.skill-rows{display:grid;gap:22px}
.skill-row{display:grid;grid-template-columns:220px minmax(0,1fr);gap:10px 32px;align-items:start}
.skill-row h3{margin:6px 0 0;font-size:1rem;font-weight:700;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-weight:500;font-size:.9375rem;padding:7px 12px;border:2px solid var(--edge);border-radius:10px;background:var(--paper)}
.skill-row.core .chip{background:var(--orange);color:var(--on-orange);border-color:var(--on-orange)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:48px}
.fact{border:2px solid var(--edge);border-radius:16px;padding:20px 22px;background:var(--soft)}
.fact h3{margin:0 0 6px;font-size:1rem;color:var(--ink-2)}
.fact p{margin:0;font-weight:500}
@media (max-width:760px){.skill-row,.facts{grid-template-columns:minmax(0,1fr)}}

/* Blog */
.blog{background:var(--soft)}
.posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;list-style:none;margin:0;padding:0}
.post a{display:flex;flex-direction:column;gap:10px;height:100%;padding:24px;background:var(--paper);border:2px solid var(--edge);border-radius:18px;box-shadow:5px 5px 0 var(--drop);text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.post a:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--drop)}
.post time{font-size:.875rem;color:var(--ink-2)}
.post h3{margin:0;font-size:1.25rem;line-height:1.25}
.post p{margin:0;color:var(--ink-2);font-size:1rem;flex:1}
.post .more{font-weight:700;color:var(--orange)}
@media (max-width:900px){.posts{grid-template-columns:minmax(0,1fr)}}

/* Testimonials + facts */
.quotes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-bottom:36px}
.quotes:empty{display:none}
.quote{margin:0;display:flex;flex-direction:column;gap:18px;padding:28px;background:var(--soft);border:2px solid var(--edge);border-radius:18px;box-shadow:5px 5px 0 var(--drop)}
.quote blockquote{margin:0;font-size:1.1875rem;line-height:1.55}
.quote blockquote::before{content:"“";display:block;font-weight:800;font-size:3rem;line-height:.6;color:var(--orange);margin-bottom:10px}
.quote figcaption{margin-top:auto;color:var(--ink-2);font-size:.9375rem}
.quote figcaption b{display:block;color:var(--ink);font-size:1rem}
.quote a{color:inherit}
.proof-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.pcard{padding:24px;background:var(--paper);border:2px solid var(--edge);border-radius:18px;box-shadow:5px 5px 0 var(--drop)}
.pcard b{display:block;font-weight:800;font-size:clamp(2.4rem,4.4vw,3.2rem);line-height:1;color:var(--orange)}
.pcard b.word{font-size:clamp(1.4rem,2.2vw,1.75rem);line-height:1.1}
.pcard p{margin:12px 0 0;color:var(--ink-2)}
@media (max-width:980px){.proof-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quotes{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.proof-grid{grid-template-columns:minmax(0,1fr)}}

/* Contact */
.contact{background:var(--plum);color:var(--on-plum)}
.contact h2{font-weight:800;font-size:clamp(2.4rem,6vw,4.6rem);line-height:1;letter-spacing:-.025em;margin:0}
.contact .lead{color:var(--on-plum-2);font-size:1.125rem;margin:18px 0 34px;max-width:36em}
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:16px 22px}
.mail a{font-weight:800;font-size:clamp(1.3rem,3.6vw,2.4rem);color:var(--sun);text-decoration:none;overflow-wrap:anywhere;direction:ltr;unicode-bidi:isolate}
.mail a:hover{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.contact .btn{background:var(--plum);color:var(--on-plum);border-color:var(--on-plum);box-shadow:4px 4px 0 var(--orange)}
.contact .btn:hover{box-shadow:6px 6px 0 var(--orange)}
.socials{display:flex;flex-wrap:wrap;gap:14px;margin-top:36px}
footer{background:var(--plum);color:var(--on-plum-2);font-size:.875rem;border-top:1px solid color-mix(in srgb,var(--on-plum) 15%,transparent)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;padding-block:24px}
footer a{color:var(--on-plum)}

/* Post reader */
.reader{padding-block:56px 96px}
.reader-inner{max-width:720px}
.back{font-weight:700;color:var(--orange);text-decoration:none}
.reader h1{font-weight:800;font-size:clamp(2rem,4.6vw,3rem);line-height:1.08;letter-spacing:-.02em;margin:22px 0 12px}
.reader h1:focus{outline:none}
.meta{color:var(--ink-2);padding-bottom:22px;border-bottom:2px solid var(--edge)}
.prose{font-size:1.125rem;line-height:1.75;max-width:65ch}
.prose p{margin:1em 0}
.prose a{color:var(--orange);font-weight:500}

/* ===================== Логика страницы ===================== */
const LANGS = ["ru", "uk", "en", "he"];
const LANG_LABEL = { ru: "RU", uk: "UA", en: "EN", he: "HE" };
const LANG_NAME = { ru: "Русский", uk: "Українська", en: "English", he: "עברית" };
const LOCALE = { ru: "ru-RU", uk: "uk-UA", en: "en-GB", he: "he-IL" };
const RTL = { he: true };

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const L = v => (v && typeof v === "object" && !Array.isArray(v)) ? (v[lang] != null ? v[lang] : (v.en || "")) : (v == null ? "" : v);
const t = k => (I18N[lang] && I18N[lang][k] != null) ? I18N[lang][k] : (I18N.en[k] != null ? I18N.en[k] : k);
const link = (url, label, cls, track) => `<a${cls ? ` class="${cls}"` : ""} href="${esc(url)}" target="_blank" rel="noopener"${track ? ` data-track="${esc(track)}"` : ""}>${esc(label)}</a>`;
const linkify = s => esc(s).replace(/\[\[(\w+)\|([^\]]+)\]\]/g, (m, key, label) => LINKS[key] ? link(LINKS[key], label, "", key) : label);
const pretty = url => url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");

/* --- Аналитика: GA4 грузится, только если задан GA_ID --- */
function track(name, params) {
  if (typeof window.gtag === "function") window.gtag("event", name, params || {});
}
if (GA_ID) {
  const s = document.createElement("script");
  s.async = true;
  s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(GA_ID);
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  window.gtag("js", new Date());
  window.gtag("config", GA_ID, { anonymize_ip: true });
}

function fmtDate(iso, long) {
  const [y, m, d] = iso.split("-").map(Number);
  const opts = long ? { day: "numeric", month: "long", year: "numeric" } : { day: "numeric", month: "short", year: "numeric" };
  return new Intl.DateTimeFormat(LOCALE[lang], opts).format(new Date(y, m - 1, d));
}
function period(from, to) {
  if (!from.includes("-")) return { span: to && to !== from ? `${from} — ${to}` : from, dur: "" };
  const [fy, fm] = from.split("-").map(Number);
  const now = new Date();
  const [ty, tm] = to ? to.split("-").map(Number) : [now.getFullYear(), now.getMonth() + 1];
  const total = (ty * 12 + tm) - (fy * 12 + fm) + 1;
  const unit = (n, u) => new Intl.NumberFormat(LOCALE[lang], { style: "unit", unit: u, unitDisplay: "long" }).format(n);
  const yrs = Math.floor(total / 12), mos = total % 12;
  return {
    span: to && ty === fy ? `${fy}` : `${fy} — ${to ? ty : t("now")}`,
    dur: [yrs ? unit(yrs, "year") : "", mos ? unit(mos, "month") : ""].filter(Boolean).join(" ")
  };
}
const readTime = body => `${Math.max(1, Math.round(body.split(/\s+/).length / 180))} ${t("min")}`;
const sortedPosts = () => POSTS.slice().sort((a, b) => b.date.localeCompare(a.date));
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  return src.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean)
    .map(b => `<p>${inline(b.split("\n").map(l => l.trim()).join(" "))}</p>`).join("");
}
function excerpt(body) {
  const first = body.split(/\n\s*\n/).map(b => b.trim()).find(Boolean) || "";
  const plain = first.replace(/\s+/g, " ").replace(/[`*]/g, "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
  if (plain.length <= 150) return plain;
  return plain.slice(0, plain.lastIndexOf(" ", 148)).replace(/[,.:;]$/, "") + "…";
}

/* --- Тема: светлая / тёмная. По умолчанию — как в системе посетителя, выбор запоминается --- */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const darkMq = window.matchMedia("(prefers-color-scheme: dark)");
const isDark = () => {
  const a = document.documentElement.getAttribute("data-theme");
  return a ? a === "dark" : darkMq.matches;
};
function renderThemeBtn() {
  const b = $("#themeBtn");
  if (!b) return;
  const dark = isDark();
  b.innerHTML = dark ? SUN : MOON;
  b.setAttribute("aria-label", t(dark ? "to_light" : "to_dark"));
  b.title = t(dark ? "to_light" : "to_dark");
}
function toggleTheme() {
  const next = isDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("cv-theme", next); } catch (e) {}
  renderThemeBtn();
  track("theme", { theme: next });
}
try {
  const saved = localStorage.getItem("cv-theme");
  if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
} catch (e) {}
if (darkMq.addEventListener) darkMq.addEventListener("change", renderThemeBtn);

function setLang(l, save) {
  lang = LANGS.includes(l) ? l : "en";
  document.documentElement.lang = lang;
  document.documentElement.dir = RTL[lang] ? "rtl" : "ltr";
  if (save) { try { localStorage.setItem("cv-lang", lang); } catch (e) {} }
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    const raw = t(el.dataset.i18nHtml);
    el.innerHTML = el.dataset.i18nHtml === "about_big" ? raw : linkify(raw);
  });
  document.title = `Gori4ka · ${PROFILE.name} · ${t("doc_role")}`;
  renderLangs(); renderThemeBtn(); renderHero(); renderStats(); renderWorks(); renderSites(); renderYT();
  renderExperience(); renderSkills(); renderPosts(); renderProof(); renderContact();
  if (currentPost) renderReader();
}
function initialLang() {
  const fromHash = location.hash.slice(1);
  if (LANGS.includes(fromHash)) return fromHash;
  try { const s = localStorage.getItem("cv-lang"); if (LANGS.includes(s)) return s; } catch (e) {}
  const prefs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""]);
  for (const p of prefs) {
    const c = String(p).slice(0, 2).toLowerCase();
    if (c === "ua") return "uk";
    if (c === "iw") return "he";
    if (LANGS.includes(c)) return c;
  }
  return "en";
}

/* --- Маршруты: #ru/#uk/#en/#he — язык, #post-<slug> — запись блога --- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (LANGS.includes(h)) { if (h !== lang) setLang(h, false); return; }
  const p = h.startsWith("post-") ? POSTS.find(x => x.slug === h.slice(5)) : null;
  if (p) {
    currentPost = p.slug;
    renderReader();
    $("#home").hidden = true;
    $("#reader").hidden = false;
    window.scrollTo(0, 0);
    const title = $("#readerTitle");
    if (title) title.focus({ preventScroll: true });
    track("read_post", { slug: p.slug });
    return;
  }
  if (currentPost) {
    currentPost = null;
    $("#reader").hidden = true;
    $("#home").hidden = false;
    const target = h && document.getElementById(h);
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }
}
function go(hash) {
  if (location.hash !== "#" + hash) {
    try { history.pushState(null, "", "#" + hash); } catch (e) { location.hash = hash; }
  }
  route();
}

document.addEventListener("click", e => {
  const tracked = e.target.closest("[data-track]");
  if (tracked) track("click", { target: tracked.dataset.track });
  if (e.target.closest("#themeBtn")) { toggleTheme(); return; }
  const langBtn = e.target.closest("[data-lang]");
  if (langBtn) { setLang(langBtn.dataset.lang, true); track("language", { lang: langBtn.dataset.lang }); return; }
  const post = e.target.closest("[data-slug]");
  if (post) { e.preventDefault(); go("post-" + post.dataset.slug); return; }
  const copy = e.target.closest("[data-copy]");
  if (copy) copyText(copy);
});
window.addEventListener("hashchange", route);
window.addEventListener("popstate", route);

setLang(initialLang(), false);
route();

/* --- Первый экран: свечение за курсором, пиксельные блоки и наклон фото --- */
(function heroFX() {
  const hero = $(".hero"), glow = $("#heroGlow"), card = $("#photoCard");
  if (!hero || !glow || !card) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  // x/y — место блока в процентах, s — размер, d — насколько сильно реагирует на мышь.
  const BLOCKS = [
    { x: 52, y: 10, s: 22, c: "o", d: 26, sm: true }, { x: 93, y: 8, s: 16, c: "k", d: 14 },
    { x: 96, y: 58, s: 28, c: "s", d: 34 }, { x: 58, y: 86, s: 18, c: "s", d: 20, sm: true },
    { x: 86, y: 92, s: 14, c: "o", d: 12 }, { x: 4, y: 90, s: 20, c: "k", d: 22, sm: true },
    { x: 63, y: 70, s: 12, c: "w", d: 40, sm: true }, { x: 74, y: 4, s: 12, c: "s", d: 30, sm: true }
  ];
  const els = BLOCKS.map(b => {
    const el = document.createElement("i");
    el.className = `px ${b.c}${b.sm ? " hide-sm" : ""}`;
    el.style.setProperty("--s", b.s + "px");
    el.style.insetInlineStart = b.x + "%";
    el.style.top = b.y + "%";
    el.setAttribute("aria-hidden", "true");
    hero.appendChild(el);
    return el;
  });
  let mx = 0, my = 0, cx = 0, cy = 0, gx = 0, gy = 0, gtx = 0, gty = 0, visible = true, raf = 0;
  hero.addEventListener("pointermove", e => {
    const r = hero.getBoundingClientRect();
    mx = (e.clientX - r.left) / r.width * 2 - 1;
    my = (e.clientY - r.top) / r.height * 2 - 1;
    gtx = e.clientX - r.left; gty = e.clientY - r.top;
    hero.classList.add("live");
    if (!raf) raf = requestAnimationFrame(frame);
  });
  hero.addEventListener("pointerleave", () => { mx = 0; my = 0; hero.classList.remove("live"); });
  new IntersectionObserver(([e]) => {
    visible = e.isIntersecting;
    if (visible && !raf) raf = requestAnimationFrame(frame);
  }).observe(hero);
  function frame(time) {
    raf = 0;
    if (!visible) return;
    cx += (mx - cx) * 0.08; cy += (my - cy) * 0.08;
    gx += (gtx - gx) * 0.12; gy += (gty - gy) * 0.12;
    glow.style.transform = `translate3d(${gx}px,${gy}px,0)`;
    card.style.setProperty("--rx", `${(-cy * 6).toFixed(2)}deg`);
    card.style.setProperty("--ry", `${(cx * 8).toFixed(2)}deg`);
    els.forEach((el, i) => {
      const b = BLOCKS[i];
      const bob = Math.sin(time / 1100 + i * 1.7) * 4;
      el.style.transform = `translate3d(${(-cx * b.d).toFixed(1)}px,${(-cy * b.d + bob).toFixed(1)}px,0) rotate(${(cx * b.d * 0.6).toFixed(1)}deg)`;
    });
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
})();

/* --- Превью сайта, которое летит за курсором --- */
(function sitePeek() {
  const peek = $("#peek"), list = $("#siteRows");
  if (!peek || !list || !window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  let on = false, x = 0, y = 0, tx = 0, ty = 0, raf = 0;
  const W = 360;
  function frame() {
    raf = 0;
    const dx = tx - x;
    x += dx * 0.18; y += (ty - y) * 0.18;
    const rot = Math.max(-8, Math.min(8, dx * 0.06));
    peek.style.transform = `translate3d(${x}px,${y}px,0) rotate(${rot.toFixed(2)}deg)`;
    if (on || Math.abs(dx) > 0.5) raf = requestAnimationFrame(frame);
  }
  list.addEventListener("pointermove", e => {
    const rtl = document.documentElement.dir === "rtl";
    tx = rtl ? e.clientX - W - 28 : e.clientX + 28;
    ty = e.clientY - 110;
    const row = e.target.closest("[data-peek]");
    if (row) {
      if (peek.getAttribute("src") !== row.dataset.peek) peek.src = row.dataset.peek;
      if (!on) { x = tx; y = ty; }
      on = true; peek.classList.add("on");
    } else { on = false; peek.classList.remove("on"); }
    if (!raf) raf = requestAnimationFrame(frame);
  });
  list.addEventListener("pointerleave", () => { on = false; peek.classList.remove("on"); });
})();
})();
</script>
